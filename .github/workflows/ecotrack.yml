name: EcoTrack CI Footprint Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-footprint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install EcoTrack CLI
      run: |
        python -m pip install --upgrade pip
        pip install psutil
        # Lokal paket kurulumu
        pip install -e .

    - name: Run Footprint Audit
      run: |
        ecotrack audit . --region EU --format markdown > footprint-report.md
        cat footprint-report.md

    - name: Comment PR with Footprint Report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('footprint-report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `### 🌿 EcoTrack Audit Results\n\n${report}`
          })
